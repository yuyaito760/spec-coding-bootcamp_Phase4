name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: devdocs-agent/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: devdocs-agent

      - name: Lint
        run: npm run lint
        working-directory: devdocs-agent

      - name: Type check
        run: npx tsc --noEmit
        working-directory: devdocs-agent

      - name: Build
        run: npm run build
        working-directory: devdocs-agent
